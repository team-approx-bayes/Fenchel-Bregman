[project]
name = "fenchel-bregman"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adrian R. Minut", email = "adrianrob3@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "adam-atan2>=0.0.3",
    "coolname>=5.0.0",
    "einops>=0.8.2",
    "evon",
    "hydra-core>=1.3.6",
    "ivon-opt==0.1.3",
    "numpy>=2.5.2",
    "omegaconf>=2.3.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "torch>=2.0",
    "tqdm>=4.70.0",
    "wandb>=0.29.0",
]

[project.scripts]
fenchel-bregman = "fenchel_bregman:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
evon = { git = "https://github.com/team-approx-bayes/evon.git", rev = "f51ee25074cfdf3b7c1a665d744ff39930d602e4" }
